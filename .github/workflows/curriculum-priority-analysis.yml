name: Curriculum Priority Analysis

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  build-report:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy matplotlib scipy

      - name: Run curriculum priority analysis
        run: |
          python -m src.analysis_curriculum_priorities

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-priority-report
          path: |
            reports/curriculum_priority_differences.md
            reports/figures/*.png
